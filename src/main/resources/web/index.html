<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calidad del aire · Canarias</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Calidad del aire <span>Canarias</span></h1>
      <p id="source" class="source">Conectando…</p>
    </div>
    <div class="controls">
      <label>Zona
        <select id="zone"><option value="">Todas</option></select>
      </label>
      <button id="refresh" type="button">Actualizar</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Paneles">
    <button class="tab active" type="button" data-panel="main">Panel</button>
    <button class="tab" type="button" data-panel="alerts" disabled title="Etapa 2: observador de alertas">Alertas</button>
    <button class="tab" type="button" data-panel="history" disabled title="Etapa 2: observador de histórico">Histórico</button>
  </nav>

  <div id="error" class="error" hidden></div>

  <main id="panel-main" class="layout">
    <section class="stations" aria-labelledby="h-stations">
      <h2 id="h-stations">Estaciones</h2>
      <div id="stations" class="grid" aria-live="polite"></div>
    </section>

    <section class="detail" aria-labelledby="h-detail">
      <h2 id="h-detail">Detalle</h2>
      <div id="detail" class="empty">Selecciona una estación para ver sus mediciones.</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
